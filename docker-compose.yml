version: "3.8"

services:
  backend:
    build: .
    container_name: safe-evaluate-api
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 报告数据持久化到宿主机
      - ./backend/data:/app/backend/data
      # 法规文档（只读）
      - ./requirement:/app/requirement:ro
    environment:
      - QWEN_API_KEY=${QWEN_API_KEY}
      - QWEN_API_BASE=${QWEN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-vl-plus}
      - APP_USERS=${APP_USERS:-{"110Csust@": "110Csust@"}}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 可选：直接内置nginx，就不需要额外装
  nginx:
    image: nginx:alpine
    container_name: safe-evaluate-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
