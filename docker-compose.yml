services:
  backend:
    build: .
    container_name: safe-evaluate-api
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 报告数据持久化到宿主机
      - ./backend/data:/app/backend/data
      # 法规文档（只读）
      - ./requirement:/app/requirement:ro
    environment:
      - APP_ENV=${APP_ENV:-production}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - QWEN_API_BASE=${QWEN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-vl-plus}
      - BACKUP_API_KEY=${BACKUP_API_KEY:-}
      - BACKUP_API_BASE=${BACKUP_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - BACKUP_MODEL=${BACKUP_MODEL:-qwen-vl-plus}
      - API_MAX_RETRIES=${API_MAX_RETRIES:-3}
      - API_RETRY_DELAY=${API_RETRY_DELAY:-1.5}
      - APP_USERS=${APP_USERS:?APP_USERS is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - PUBLIC_JOB_EXPIRY_HOURS=${PUBLIC_JOB_EXPIRY_HOURS:-24}
      - PUBLIC_JOB_MAX_FILES=${PUBLIC_JOB_MAX_FILES:-30}
      - PUBLIC_JOB_MAX_TOTAL_SIZE=${PUBLIC_JOB_MAX_TOTAL_SIZE:-157286400}
      - PUBLIC_JOB_CREATE_RATE=${PUBLIC_JOB_CREATE_RATE:-20}
      - PUBLIC_JOB_MAX_CONCURRENCY=${PUBLIC_JOB_MAX_CONCURRENCY:-2}
      - LIBREOFFICE_COMMAND=${LIBREOFFICE_COMMAND:-soffice}
      - TESSERACT_COMMAND=${TESSERACT_COMMAND:-tesseract}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 可选：直接内置nginx，就不需要额外装
  nginx:
    image: nginx:alpine
    container_name: safe-evaluate-nginx
    restart: always
    ports:
      - "80:80"
      # - "443:443"   # HTTPS：配置 SSL 证书后取消注释
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./website/dist:/usr/share/nginx/website:ro
      - ./frontend-public/dist:/usr/share/nginx/html/evaluate:ro
      - ./frontend/dist:/usr/share/nginx/html/evaluate_tianxin:ro
      # - ./ssl:/etc/nginx/ssl:ro   # HTTPS：配置 SSL 证书后取消注释
    depends_on:
      - backend
