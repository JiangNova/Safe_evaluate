# AGULAB website and two evaluation platforms on one origin

server {
    listen 80;
    server_name agulab.cn www.agulab.cn;

    return 301 https://agulab.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name www.agulab.cn;

    ssl_certificate /etc/nginx/ssl/agulab.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/agulab.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://agulab.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name agulab.cn;

    ssl_certificate /etc/nginx/ssl/agulab.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/agulab.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /usr/share/nginx/website;
    index index.html;
    charset utf-8;

    # Backend API behavior remains unchanged.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
    }

    # Website assets built by Vite.
    location ^~ /website-static/ {
        alias /usr/share/nginx/website/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public platform hashed assets must never fall back to SPA HTML.
    location ^~ /evaluate/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tianxin platform hashed assets must never fall back to SPA HTML.
    location ^~ /evaluate_tianxin/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # AI writing assistant assets must never fall back to SPA HTML.
    location ^~ /ai-writing/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /evaluate {
        return 302 /evaluate/;
    }

    # Neutral public evaluation platform SPA.
    location ^~ /evaluate/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /evaluate/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /evaluate_tianxin {
        return 302 /evaluate_tianxin/;
    }

    # Existing authenticated Tianxin platform SPA.
    location ^~ /evaluate_tianxin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /evaluate_tianxin/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /ai-writing {
        return 302 /ai-writing/;
    }

    # Private direct-link AI writing assistant SPA.
    location ^~ /ai-writing/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /ai-writing/index.html;
        add_header Cache-Control "no-cache";
    }

    # Keep previously issued private links usable after the platform rename.
    location = /leader-assistant {
        return 302 /ai-writing/;
    }

    location ^~ /leader-assistant/ {
        return 302 /ai-writing/;
    }

    # AGULAB website and its internal SPA routes.
    location / {
        root /usr/share/nginx/website;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
