# AGULAB 官网 + SafeEvaluate 平台同域部署

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/website;
    index index.html;
    charset utf-8;

    # 后端 API
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
    }

    # 官网由 Vite 构建的资源
    location ^~ /website-static/ {
        alias /usr/share/nginx/website/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SafeEvaluate 由 Vite 构建的资源
    location ^~ /assets/ {
        alias /usr/share/nginx/platform/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SafeEvaluate 顶层 SPA 路由
    location ~ ^/(?:login|evaluate|history|rules|stats)(?:/.*)?$ {
        root /usr/share/nginx/platform;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # SafeEvaluate 报告详情路由
    location ~ ^/report(?:/.*)?$ {
        root /usr/share/nginx/platform;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # AGULAB 官网及其内部 SPA 路由
    location / {
        root /usr/share/nginx/website;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
